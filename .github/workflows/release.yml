name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 绿色版
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确定版本号
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: 安装依赖与打包工具
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包（onedir 绿色版）
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name LanCloud \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --collect-all pydivert \
            --add-data "lancloud/templates;lancloud/templates" \
            --add-data "lancloud/static;lancloud/static" \
            run.py

      - name: 生成绿色版使用说明
        shell: bash
        run: |
          cat > dist/LanCloud/使用说明.txt <<'EOF'
          LanCloud 局域网私有云网盘 - Windows 绿色版

          使用步骤：
          1. 双击 LanCloud.exe 启动（首次启动会稍慢，属正常）
          2. 浏览器打开 http://127.0.0.1:8080
          3. 默认管理员：admin / admin123，登录后请尽快修改密码
             （编辑本目录 data/config.json 中的 admin_password，保存后重启）

          局域网访问：
          - 其他设备访问 http://你的IP:8080（启动窗口会打印所有可用地址）
          - 域名定向（DNS 劫持）在登录后「管理面板」中配置，并附有图文教程

          全自动接管（方案 C，Windows 专属）：
          1. 以管理员身份运行 LanCloud.exe（右键 → 以管理员身份运行）
          2. 管理面板 → 劫持向导 → 方案 C → 一键接管
          3. 程序自动安装内置内核驱动，同 WiFi 下所有设备 DNS 自动送到本机，
             被劫持域名直接打开你的网盘，其他网站照常上网
          4. 点击「停止并恢复」自动恢复，设备无需任何设置
             （若杀毒软件拦截驱动安装，请放行 LanCloud 并确认以管理员运行）

          数据位置：
          - 所有数据保存在本目录 data/ 下，备份时复制整个 data 文件夹
          - 想彻底删除：关闭程序后删除本目录即可

          注意：
          - DNS 服务使用 53 端口需要管理员权限（右键 LanCloud.exe → 以管理员身份运行）
          - 防火墙弹窗请允许访问，否则其他设备无法连接
          EOF

      - name: 压缩绿色版
        shell: bash
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path LanCloud -DestinationPath LanCloud-v${VERSION}-win64.zip -Force"
          ls -lh LanCloud-v${VERSION}-win64.zip

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: LanCloud v${{ env.VERSION }}
          body: |
            ## LanCloud v${{ env.VERSION }}

            ### Windows 绿色版（免安装，解压即用）
            - 下载 `LanCloud-v${{ env.VERSION }}-win64.zip`，解压后双击 `LanCloud.exe`
            - 浏览器打开 `http://127.0.0.1:8080`，默认账号 `admin / admin123`
            - 数据保存在 exe 同目录 `data/`，删除文件夹即卸载

            ### 网盘（私有云）
            - 上传 / 下载 / 在线预览（图片·视频·音频·文本·PDF）/ **在线文本编辑**
            - **目录 zip 打包下载**、新建文件夹、重命名、移动、搜索
            - 分享链接：免登录 / **强制登录** / **有效期**；回收站（恢复·彻底删除·清空）
            - 多用户 + **存储配额**（全局默认 + 单用户设置）

            ### 管理面板
            - **用户管理**：单独 / 批量创建账号、禁用启用、重置密码、配额、分享权限
            - **共享文件夹**：把本机任意目录共享给局域网用户浏览 / 下载
            - 开放注册开关、默认配额、单文件大小限制

            ### 域名定向（DNS 劫持）
            - 内置 DNS 服务（UDP+TCP），可视化配置 `pan.lan → 你的 IP`
            - **三种接管模式**：IP 直达（网盘）/ **跳转网址**（劫持域名自动跳到其他网站）/ **自定义页面**（自写落地页，支持占位符）
            - **劫持向导**：分步指引 + **一键诊断** + **实时查询日志**，快速定位不生效原因
            - 未匹配域名自动转发上游，不影响正常上网
            - 其他设备**零配置**：仅需路由器 / 设备把 DNS 指向本机

            ### 🚀 方案 C：Windows 全自动接管（v2.1.0 新增，v2.2.0 增强）
            - **设备一个设置都不用做**：自动安装内置 WinDivert 内核驱动（免下载）
            - 本机伪装成网关，同 WiFi 下所有设备的 DNS 查询自动送到本机
            - 被劫持域名直接打开你的网盘，其他网站照常上网；停止后自动恢复
            - **一键扫描整个局域网**（ping 全网段）发现全部在线设备，勾选接管范围，保存后一键接管
            - 管理面板「劫持向导 → 方案 C」一键接管 / 停止，实时状态与日志
            - 使用前提：管理员身份运行 + 同一局域网 + 仅限自有 / 已授权网络

            ### 自签名 HTTPS
            - 自动生成 CA + 服务器证书（覆盖局域网 IP 与全部域名映射）
            - HTTP + HTTPS 双服务；管理面板一键开关、下载 CA 证书

            ### 说明
            - DNS 53 端口需管理员权限运行（右键 → 以管理员身份运行）
            - 劫持请仅在自有 / 已授权网络使用，遵守《网络安全法》
          files: dist/LanCloud-v${{ env.VERSION }}-win64.zip
