<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LanCloud · 局域网私有云网盘</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F6B4F'/%3E%3Cpath d='M9 21V12l7-4 7 4v9h-5v-5h-4v5z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>

<!-- 登录页 -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"/></svg>
      </div>
      <div class="logo-title">LanCloud</div>
      <div class="logo-sub">局域网私有云网盘 · 数据只在你自己的设备上</div>
    </div>
    <div class="login-tabs">
      <button id="tab-login" class="active" onclick="switchLoginTab('login')">登录</button>
      <button id="tab-reg" onclick="switchLoginTab('reg')">注册</button>
    </div>
    <form id="login-form" onsubmit="return doLogin(event)">
      <div class="form-row"><label>用户名</label>
        <input class="input" id="login-user" autocomplete="username" placeholder="输入用户名" required></div>
      <div class="form-row"><label>密码</label>
        <input class="input" type="password" id="login-pass" autocomplete="current-password" placeholder="输入密码" required></div>
      <button type="submit" class="btn primary">登 录</button>
    </form>
    <form id="reg-form" style="display:none" onsubmit="return doRegister(event)">
      <div class="form-row"><label>用户名</label>
        <input class="input" id="reg-user" autocomplete="username" placeholder="至少 2 个字符" required></div>
      <div class="form-row"><label>密码</label>
        <input class="input" type="password" id="reg-pass" autocomplete="new-password" placeholder="至少 6 位" required></div>
      <button type="submit" class="btn primary">注 册 并 登 录</button>
    </form>
    <div class="login-tip" id="reg-tip">首次启动已自动创建管理员：admin / admin123<br>登录后请在管理面板修改密码与配置</div>
  </div>
</div>

<!-- 主应用 -->
<div id="app-view">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"/></svg>
      </div>
      <div><div class="brand-name">LanCloud</div><div class="brand-sub">局域网私有云</div></div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="files" onclick="switchView('files')">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M245,110.64A16,16,0,0,0,232,104H216V88a16,16,0,0,0-16-16H130.67L102.94,51.2a16.14,16.14,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V208h0a8,8,0,0,0,8,8H211.1a8,8,0,0,0,7.59-5.47Z"/></svg>我的网盘</button>
      <button class="nav-item" data-view="mounts" onclick="switchView('mounts')">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,64H32A16,16,0,0,0,16,80v96a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V80A16,16,0,0,0,224,64Zm0,112H32V80H224v96Zm-24-48a12,12,0,1,1-12-12A12,12,0,0,1,200,128Z"/></svg>共享文件夹</button>
      <button class="nav-item" data-view="shares" onclick="switchView('shares')">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M176,160a39.89,39.89,0,0,0-28.62,12.09l-46.1-29.63a39.8,39.8,0,0,0,0-28.92l46.1-29.63a40,40,0,1,0-8.66-13.45l-46.1,29.63a40,40,0,1,0,0,55.82l46.1,29.63A40,40,0,1,0,176,160Zm0-128a24,24,0,1,1-24,24A24,24,0,0,1,176,32ZM64,152a24,24,0,1,1,24-24A24,24,0,0,1,64,152Zm112,72a24,24,0,1,1,24-24A24,24,0,0,1,176,224Z"/></svg>分享管理</button>
      <button class="nav-item" data-view="trash" onclick="switchView('trash')">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M96,208a8,8,0,0,1-8,8H40a24,24,0,0,1-20.77-36l34.29-59.25L39.47,124.5A8,8,0,1,1,35.33,109l32.77-8.77a8,8,0,0,1,9.8,5.66l8.79,32.77A8,8,0,0,1,81,148.5a8.37,8.37,0,0,1-2.08.27,8,8,0,0,1-7.72-5.93l-3.8-14.15L33.11,188A8,8,0,0,0,40,200H88A8,8,0,0,1,96,208Z"/></svg>回收站</button>
      <button class="nav-item" id="nav-admin" style="display:none" onclick="location.href='/admin'">
        <svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>管理面板</button>
    </nav>
    <div class="side-user">
      <div class="storage-box">
        <div class="bar"><i id="usage-bar" style="width:0%"></i></div>
        <div class="txt" id="usage-txt">计算中…</div>
      </div>
      <div class="user-row">
        <div class="user-avatar" id="user-avatar">客</div>
        <div class="user-meta">
          <div class="uname" id="user-name">-</div>
          <div class="urole" id="user-role">-</div>
        </div>
        <button class="logout-btn" title="退出登录" onclick="doLogout()">
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <!-- 文件视图 -->
    <section id="view-files">
      <div class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-actions">
          <div class="search-box">
            <input id="search-input" placeholder="搜索文件…" onkeydown="if(event.key==='Enter')doSearch()">
            <span class="s-ico"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg></span>
          </div>
          <button class="btn" onclick="openNewFolder()">
            <svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z"/></svg>新建文件夹</button>
          <button class="btn" onclick="zipCurrent()" title="将当前目录打包为 zip 下载">
            <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg>打包下载</button>
          <button class="btn primary" onclick="document.getElementById('file-input').click()">
            <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z"/></svg>上传</button>
          <input type="file" id="file-input" multiple style="display:none" onchange="handleSelect(event)">
        </div>
      </div>
      <div class="panel">
        <div class="panel-toolbar">
          <span id="dir-count" style="font-size:12.5px;color:var(--ink-3);font-weight:500"></span>
          <div class="spacer"></div>
          <div class="view-toggle">
            <button id="vt-grid" class="active" onclick="setView('grid')">
              <svg viewBox="0 0 256 256" fill="currentColor"><path d="M200,40H56A16,16,0,0,0,40,56V200a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,80H136V56h64ZM120,56v64H56V56ZM56,136h64v64H56Zm144,64H136V136h64v64Z"/></svg>网格</button>
            <button id="vt-list" onclick="setView('list')">
              <svg viewBox="0 0 256 256" fill="currentColor"><path d="M80,64a8,8,0,0,1,8-8H216a8,8,0,0,1,0,16H88A8,8,0,0,1,80,64Zm136,56H88a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Zm0,64H88a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16ZM44,52A12,12,0,1,0,56,64,12,12,0,0,0,44,52Zm0,64a12,12,0,1,0,12,12A12,12,0,0,0,44,116Zm0,64a12,12,0,1,0,12,12A12,12,0,0,0,44,180Z"/></svg>列表</button>
          </div>
        </div>
        <div class="drop-zone" id="drop-zone">松开鼠标，把文件拖到这里上传</div>
        <div id="file-grid" class="file-grid"></div>
        <div id="file-list" class="file-list">
          <table><thead><tr><th style="width:44%">名称</th><th>大小</th><th>修改时间</th><th style="width:150px">操作</th></tr></thead><tbody id="file-list-body"></tbody></table>
        </div>
      </div>
    </section>

    <!-- 共享文件夹视图 -->
    <section id="view-mounts" style="display:none">
      <div class="topbar">
        <div class="crumbs" id="mount-crumbs"><span class="cur">共享文件夹</span></div>
      </div>
      <div class="panel">
        <div id="mount-root" style="padding:8px 0">
          <table class="data-table">
            <thead><tr><th>共享名称</th><th>说明</th><th style="width:100px">操作</th></tr></thead>
            <tbody id="mount-list-body"></tbody>
          </table>
        </div>
        <div id="mount-folder" style="display:none">
          <table class="data-table">
            <thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th style="width:120px">操作</th></tr></thead>
            <tbody id="mount-files-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 分享视图 -->
    <section id="view-shares" style="display:none">
      <div class="topbar"><div class="crumbs"><span class="cur">分享管理</span></div></div>
      <div class="panel">
        <div class="data-table-wrap"><table class="data-table">
          <thead><tr><th>分享名称</th><th>路径</th><th>创建时间</th><th>访问限制</th><th>链接</th><th style="width:90px">操作</th></tr></thead>
          <tbody id="shares-body"></tbody>
        </table></div>
      </div>
    </section>

    <!-- 回收站视图 -->
    <section id="view-trash" style="display:none">
      <div class="topbar">
        <div class="crumbs"><span class="cur">回收站</span></div>
        <div class="topbar-actions"><button class="btn danger" onclick="emptyTrash()">清空回收站</button></div>
      </div>
      <div class="panel">
        <table class="data-table">
          <thead><tr><th>名称</th><th>类型</th><th>删除时间</th><th style="width:160px">操作</th></tr></thead>
          <tbody id="trash-body"></tbody>
        </table>
      </div>
    </section>

    <div class="foot-note">LanCloud · 数据存储在本机 data 目录，不上传任何第三方服务器</div>
  </main>
</div>

<!-- 批量操作栏 -->
<div class="batch-bar" id="batch-bar">
  <span class="bc-count" id="bc-count">已选 0 项</span>
  <button class="btn" onclick="batchDownload()">下载</button>
  <button class="btn danger" onclick="batchDelete()">删除</button>
  <button class="btn" onclick="clearSelection()">取消</button>
</div>

<!-- 文件详情侧栏 -->
<aside class="detail-panel" id="detail-panel">
  <div class="dp-icon" id="dp-icon"></div>
  <div class="dp-name" id="dp-name"></div>
  <div class="dp-row"><span class="k">类型</span><span class="v" id="dp-type"></span></div>
  <div class="dp-row"><span class="k">大小</span><span class="v" id="dp-size"></span></div>
  <div class="dp-row"><span class="k">修改时间</span><span class="v" id="dp-mtime"></span></div>
  <div class="dp-row"><span class="k">路径</span><span class="v" id="dp-path"></span></div>
  <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">
    <button class="btn primary" style="flex:1" id="dp-open">打开 / 预览</button>
    <button class="btn" style="flex:1" id="dp-close">关闭</button>
  </div>
</aside>

<!-- 模态框容器 -->
<div id="modal-root"></div>
<div id="toast-box"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
