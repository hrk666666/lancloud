<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EEF3FC"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#3B9EFF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EA876"/>
      <stop offset="1" stop-color="#5BC8A5"/>
    </linearGradient>
  </defs>

  <rect width="820" height="470" rx="16" fill="url(#bg)" stroke="#E4EAF3"/>

  <!-- 标题 -->
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">局域网域名定向（DNS 劫持）原理</text>
  <text x="410" y="54" text-anchor="middle" font-size="11.5" fill="#8A97AC">示意图 · 本服务只命中你配置的域名，其余域名正常上网</text>

  <!-- 设备 -->
  <rect x="330" y="78" width="160" height="58" rx="12" fill="#fff" stroke="#C9D5E8"/>
  <text x="410" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">局域网设备</text>
  <text x="410" y="122" text-anchor="middle" font-size="11.5" fill="#6B7A90">手机 / 电脑 / 平板</text>

  <!-- 向下箭头 -->
  <line x1="410" y1="136" x2="410" y2="158" stroke="#8A97AC" stroke-width="1.5"/>
  <polygon points="410,164 404,154 416,154" fill="#8A97AC"/>
  <text x="410" y="150" text-anchor="middle" font-size="11.5" fill="#6B7A90" transform="translate(0,-2)"></text>

  <!-- DNS 查询 -->
  <rect x="290" y="168" width="240" height="44" rx="22" fill="url(#blue)"/>
  <text x="410" y="196" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">DNS 查询：pan.lan 在哪？</text>

  <!-- 分叉箭头 -->
  <line x1="330" y1="212" x2="180" y2="250" stroke="#2EA876" stroke-width="1.5"/>
  <polygon points="180,256 190,246 174,246" fill="#2EA876"/>
  <line x1="490" y1="212" x2="620" y2="250" stroke="#2F6FED" stroke-width="1.5"/>
  <polygon points="640,256 630,246 646,246" fill="#2F6FED"/>

  <!-- 路径 A：普通 DNS -->
  <rect x="42" y="260" width="220" height="120" rx="12" fill="#fff" stroke="#A8DCC4" stroke-width="1.5"/>
  <rect x="42" y="260" width="220" height="30" rx="12" fill="rgba(46,168,118,0.12)"/>
  <text x="152" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1F6B47">路径 A · 正常上网</text>
  <text x="152" y="312" text-anchor="middle" font-size="12" fill="#1B2733">路由器 / 公网 DNS</text>
  <text x="152" y="334" text-anchor="middle" font-size="12" fill="#1B2733">返回真实的 IP</text>
  <text x="152" y="356" text-anchor="middle" font-size="12" fill="#8A97AC">访问真实网站，一切照旧</text>

  <!-- 路径 B：你的 DNS -->
  <rect x="548" y="260" width="230" height="120" rx="12" fill="#fff" stroke="#9CC4F7" stroke-width="1.5"/>
  <rect x="548" y="260" width="230" height="30" rx="12" fill="rgba(47,111,237,0.10)"/>
  <text x="663" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#2456B8">路径 B · 你的 DNS 服务</text>
  <text x="663" y="312" text-anchor="middle" font-size="12" fill="#1B2733">命中映射：pan.lan → 你的 IP</text>
  <text x="663" y="334" text-anchor="middle" font-size="12" fill="#1B2733">设备直接连到你的服务器</text>
  <text x="663" y="356" text-anchor="middle" font-size="12" fill="#8A97AC">无需任何配置或证书</text>

  <!-- 汇合箭头 -->
  <line x1="152" y1="380" x2="152" y2="404" stroke="#8A97AC" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="663" y1="380" x2="663" y2="404" stroke="#2F6FED" stroke-width="1.5"/>
  <polygon points="663,412 657,402 669,402" fill="#2F6FED"/>

  <!-- 结果 -->
  <rect x="548" y="416" width="230" height="40" rx="10" fill="url(#blue)"/>
  <text x="663" y="442" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">打开你的网盘 / 自定义页面</text>

  <!-- 限制提示 -->
  <rect x="20" y="416" width="330" height="40" rx="10" fill="rgba(232,150,12,0.12)" stroke="#E8B95C"/>
  <text x="185" y="434" text-anchor="middle" font-size="11.5" fill="#8A5B05">限制：HTTPS 网站会有证书警告，</text>
  <text x="185" y="450" text-anchor="middle" font-size="11.5" fill="#8A5B05">静默劫持 HTTPS 做不到（TLS 设计保证）</text>
</svg>
